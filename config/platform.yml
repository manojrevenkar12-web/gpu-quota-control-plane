# The control plane's settings. The world never reads this file (AGENTS.md).

reservations:
  reservable_share: 0.80          # at most this share of a cluster is sold as reservations at any step
  max_nodes_per_request: 40

lending:                          # idle reserved nodes lent to the preemptible pool, taken back on demand
  warmup_steps: 96                # watch a reservation for a day before lending any of it
  window_steps: 672               # forecast errors over the last 7 days
  error_quantile: 0.999           # the buffer covers this quantile of under-forecasts
  min_buffer_nodes: 1

reclaim:                          # reservations nobody has started
  grace_hours: 36                 # after the start with zero use, send a notice
  notice_hours: 24                # no answer by then: release the capacity

quotas:
  default_nodes: 2
  auto_approve_max_nodes: 16      # larger requests always go to a person
  auto_approve_risk_max: 0.30
  risk_weights:                   # visible signals only; the score is a sum of these
    new_account: 0.35             # under 14 days
    payment_unverified: 0.30
    no_prior_spend: 0.20
    single_member: 0.10
    big_jump: 0.15                # asks for more than 4x the current quota
    flat_out: 0.35                # metering: at its quota for 95% of the last 24 hours (mining looks like this)

fairness:
  weight: { paying: 1.0, unverified: 0.5 }

saga:
  relay_batch: 64
  max_attempts: 8
